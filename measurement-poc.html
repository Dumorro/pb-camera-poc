<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P&B Measurement PoC — Skin Detection</title>
    <style>
        /* ── Reset & Base ───────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Layout ─────────────────────────────────────────────────── */
        #app {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Header ─────────────────────────────────────────────────── */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }
        header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        header p {
            margin: 0;
            font-size: 0.7rem;
            color: #666;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }
        #status-dot.ready { background: #44ff88; }
        #status-text { color: #888; }

        /* ── File Input ─────────────────────────────────────────────── */
        #input-section {
            display: flex;
            justify-content: center;
            padding: 24px 0;
        }
        #file-label {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 50px;
            background: #f0f0f0;
            color: #000;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        #file-label.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        /* ── Processing Spinner ─────────────────────────────────────── */
        #processing {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 32px;
            color: #888;
            font-size: 0.9rem;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #333;
            border-top-color: #f0f0f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Result Canvas ──────────────────────────────────────────── */
        #result-canvas {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #222;
        }

        /* ── Measurement Display ────────────────────────────────────── */
        #measurement-display {
            display: flex;
            gap: 12px;
        }
        .metric-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            align-items: center;
        }
        .metric-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f0f0f0;
            line-height: 1;
        }
        .metric-unit {
            font-size: 1rem;
            font-weight: 400;
            color: #aaa;
        }

        /* ── Banners ────────────────────────────────────────────────── */
        .banner {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.5;
        }
        .banner.error {
            background: rgba(180, 30, 30, 0.9);
            color: #fff;
        }
        .banner.warning {
            background: rgba(255, 200, 0, 0.08);
            border: 1px solid rgba(255, 200, 0, 0.35);
            color: #d4b800;
        }

        /* ── Disclaimer ─────────────────────────────────────────────── */
        #disclaimer {
            margin: 0;
            font-size: 0.72rem;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        /* ── Buttons ────────────────────────────────────────────────── */
        #retake-btn {
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: transparent;
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ── Debug Panel ────────────────────────────────────────────── */
        #debug-panel summary {
            cursor: pointer;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 8px 0;
        }
        .debug-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px 0;
        }
        .debug-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .debug-cell canvas {
            width: 100%;
            border-radius: 4px;
            border: 1px solid #222;
            background: #111;
        }
        .debug-cell span {
            font-size: 0.65rem;
            color: #555;
            text-align: center;
        }
        #debug-metrics {
            margin: 8px 0 0;
            font-size: 0.65rem;
            color: #444;
            white-space: pre-wrap;
            font-family: monospace;
        }

        /* ── Utility ────────────────────────────────────────────────── */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>P&B Measurement PoC</h1>
            <p>Skin Detection + Perspective Correction</p>
            <div class="status-row">
                <span id="status-dot"></span>
                <span id="status-text">Loading OpenCV.js...</span>
            </div>
        </header>

        <main>
            <!-- File input -->
            <div id="input-section">
                <label id="file-label" class="disabled" for="file-input">
                    Take Photo / Select Image
                </label>
                <input type="file" id="file-input" accept="image/*" capture="environment" disabled>
            </div>

            <!-- Processing spinner -->
            <div id="processing" class="hidden">
                <div class="spinner"></div>
                <span>Analisando...</span>
            </div>

            <!-- Error banner -->
            <div id="error-banner" class="banner error hidden"></div>

            <!-- Warning banner -->
            <div id="warning-banner" class="banner warning hidden"></div>

            <!-- Result canvas -->
            <canvas id="result-canvas" class="hidden"></canvas>

            <!-- Measurement display -->
            <div id="measurement-display" class="hidden">
                <div class="metric-card">
                    <span class="metric-label">Comprimento</span>
                    <span id="length-value" class="metric-value">--</span>
                    <span class="metric-unit">cm</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">px/mm</span>
                    <span id="pxmm-value" class="metric-value">--</span>
                </div>
            </div>

            <!-- Disclaimer -->
            <p id="disclaimer" class="hidden">
                Resultados aproximados. Iluminacao, angulo e segmentacao afetam a precisao.
            </p>

            <!-- Retake button -->
            <button id="retake-btn" class="hidden">Nova medicao</button>

            <!-- Debug panel -->
            <details id="debug-panel" class="hidden">
                <summary>Debug Pipeline</summary>
                <div class="debug-grid">
                    <div class="debug-cell">
                        <canvas id="debug-gray"></canvas>
                        <span>Grayscale</span>
                    </div>
                    <div class="debug-cell">
                        <canvas id="debug-enhanced"></canvas>
                        <span>CLAHE / EqHist</span>
                    </div>
                    <div class="debug-cell">
                        <canvas id="debug-edges"></canvas>
                        <span>Canny Edges</span>
                    </div>
                    <div class="debug-cell">
                        <canvas id="debug-card"></canvas>
                        <span>Card Detection</span>
                    </div>
                    <div class="debug-cell">
                        <canvas id="debug-skin"></canvas>
                        <span>Skin Mask</span>
                    </div>
                    <div class="debug-cell">
                        <canvas id="debug-roi"></canvas>
                        <span>ROI + Measurement</span>
                    </div>
                </div>
                <pre id="debug-metrics"></pre>
            </details>
        </main>
    </div>

    <!-- Hidden image element for loading user photos -->
    <img id="src-image" style="display:none">

    <!-- ════════════════════════════════════════════════════════════════
         ALL JAVASCRIPT BELOW
         PRIVACY: No image data ever leaves the browser.
         No fetch, no XHR, no postMessage to external origins.
         Everything runs 100% client-side via OpenCV.js (WASM).
         ════════════════════════════════════════════════════════════════ -->
    <script>
    'use strict';

    // ── Constants ────────────────────────────────────────────────────
    const CARD_WIDTH_MM  = 85.60;
    const CARD_HEIGHT_MM = 53.98;
    const CARD_RATIO     = CARD_WIDTH_MM / CARD_HEIGHT_MM; // ~1.585
    const CARD_RATIO_TOLERANCE = 0.12;       // for detection candidate filtering
    const PERSPECTIVE_OK_TOLERANCE = 0.25;   // deviation threshold for quality warning

    const CANNY_LOW  = 40;   // validated in existing pipeline
    const CANNY_HIGH = 120;

    const MIN_CARD_SIDE_PX = 80;
    const MAX_IMAGE_DIM = 1920; // downscale large phone photos

    // HSV skin color ranges (two bands for hue wrap-around)
    const SKIN_H_LOW1 = 0,   SKIN_S_LOW1 = 30,  SKIN_V_LOW1 = 60;
    const SKIN_H_HIGH1 = 25, SKIN_S_HIGH1 = 170, SKIN_V_HIGH1 = 255;
    const SKIN_H_LOW2 = 170, SKIN_S_LOW2 = 30,   SKIN_V_LOW2 = 60;
    const SKIN_H_HIGH2 = 180,SKIN_S_HIGH2 = 170,  SKIN_V_HIGH2 = 255;

    // ── DOM References ──────────────────────────────────────────────
    const $statusDot      = document.getElementById('status-dot');
    const $statusText     = document.getElementById('status-text');
    const $inputSection   = document.getElementById('input-section');
    const $fileLabel      = document.getElementById('file-label');
    const $fileInput      = document.getElementById('file-input');
    const $processing     = document.getElementById('processing');
    const $errorBanner    = document.getElementById('error-banner');
    const $warningBanner  = document.getElementById('warning-banner');
    const $resultCanvas   = document.getElementById('result-canvas');
    const $measureDisplay = document.getElementById('measurement-display');
    const $lengthValue    = document.getElementById('length-value');
    const $pxmmValue      = document.getElementById('pxmm-value');
    const $disclaimer     = document.getElementById('disclaimer');
    const $retakeBtn      = document.getElementById('retake-btn');
    const $debugPanel     = document.getElementById('debug-panel');
    const $debugMetrics   = document.getElementById('debug-metrics');

    // ── State ───────────────────────────────────────────────────────
    let cvReady = false;

    // ── UI Helpers ──────────────────────────────────────────────────
    function show(el)  { el.classList.remove('hidden'); }
    function hide(el)  { el.classList.add('hidden'); }

    function showError(msg) {
        $errorBanner.textContent = msg;
        show($errorBanner);
    }
    function showWarning(msg) {
        $warningBanner.textContent = msg;
        show($warningBanner);
    }

    function showResult(lengthCm, pxPerMm) {
        $lengthValue.textContent = lengthCm;
        $pxmmValue.textContent = pxPerMm.toFixed(1);
        show($resultCanvas);
        show($measureDisplay);
        show($disclaimer);
        show($retakeBtn);
        show($debugPanel);
    }

    function resetUI() {
        hide($processing);
        hide($errorBanner);
        hide($warningBanner);
        hide($resultCanvas);
        hide($measureDisplay);
        hide($disclaimer);
        hide($retakeBtn);
        hide($debugPanel);
        show($inputSection);
        $debugMetrics.textContent = '';
    }

    // ── Memory Management ───────────────────────────────────────────
    function releaseMats(/* ...mats */) {
        for (let i = 0; i < arguments.length; i++) {
            try { if (arguments[i]) arguments[i].delete(); } catch (_) { /* already freed */ }
        }
    }

    // ── Debug Rendering ─────────────────────────────────────────────
    function matToCanvas(mat, canvasId) {
        if (!mat || mat.isDeleted()) return;
        let display = null;
        try {
            if (mat.channels() === 1) {
                display = new cv.Mat();
                cv.cvtColor(mat, display, cv.COLOR_GRAY2RGBA);
            } else if (mat.channels() === 3) {
                display = new cv.Mat();
                cv.cvtColor(mat, display, cv.COLOR_BGR2RGBA);
            } else {
                display = mat.clone();
            }
            cv.imshow(canvasId, display);
        } finally {
            releaseMats(display);
        }
    }

    // ── Image Loading ───────────────────────────────────────────────
    function loadImageToMat(imgElement) {
        const w = imgElement.naturalWidth;
        const h = imgElement.naturalHeight;

        // Downscale if needed
        let drawW = w, drawH = h;
        if (Math.max(w, h) > MAX_IMAGE_DIM) {
            const scale = MAX_IMAGE_DIM / Math.max(w, h);
            drawW = Math.round(w * scale);
            drawH = Math.round(h * scale);
        }

        const canvas = document.createElement('canvas');
        canvas.width = drawW;
        canvas.height = drawH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0, drawW, drawH);
        const imageData = ctx.getImageData(0, 0, drawW, drawH);
        return cv.matFromImageData(imageData);
    }

    // ── Step 1: Preprocess ──────────────────────────────────────────
    function preprocessImage(src) {
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let enhanced = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

        // CLAHE with fallback to equalizeHist
        if (typeof cv.createCLAHE === 'function') {
            let clahe = cv.createCLAHE(2.0, new cv.Size(8, 8));
            clahe.apply(blurred, enhanced);
            clahe.delete();
        } else {
            cv.equalizeHist(blurred, enhanced);
        }

        // Debug: render intermediates
        matToCanvas(gray, 'debug-gray');
        matToCanvas(enhanced, 'debug-enhanced');

        // Caller must delete gray, blurred, enhanced
        return { gray: gray, blurred: blurred, enhanced: enhanced };
    }

    // ── Corner Ordering ─────────────────────────────────────────────
    function orderCorners(pts) {
        // pts: array of {x, y} (4 points)
        // Returns [topLeft, topRight, bottomRight, bottomLeft]
        const sums = pts.map(function(p) { return p.x + p.y; });
        const diffs = pts.map(function(p) { return p.y - p.x; });

        var tl = pts[sums.indexOf(Math.min.apply(null, sums))];
        var br = pts[sums.indexOf(Math.max.apply(null, sums))];
        var tr = pts[diffs.indexOf(Math.min.apply(null, diffs))];
        var bl = pts[diffs.indexOf(Math.max.apply(null, diffs))];

        return [tl, tr, br, bl];
    }

    // ── Step 2: Detect Card ─────────────────────────────────────────
    function detectCard(enhanced, src) {
        let edges = new cv.Mat();
        let dilated = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        let kernel = null;
        let debugCardMat = null;

        try {
            // Edge detection
            cv.Canny(enhanced, edges, CANNY_LOW, CANNY_HIGH);

            kernel = cv.Mat.ones(3, 3, cv.CV_8U);
            cv.dilate(edges, dilated, kernel);

            // Debug: show edges
            matToCanvas(edges, 'debug-edges');

            // Find contours — RETR_LIST to find card even inside paper
            cv.findContours(dilated, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            // Filter for card-shaped quadrilaterals
            let bestCandidate = null;
            let bestApproxPts = null;
            let allCandidates = []; // for debug drawing

            for (let i = 0; i < contours.size(); i++) {
                let contour = contours.get(i);
                let perimeter = cv.arcLength(contour, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(contour, approx, 0.02 * perimeter, true);

                if (approx.rows === 4) {
                    let rotated = cv.minAreaRect(approx);
                    let w = rotated.size.width;
                    let h = rotated.size.height;
                    let longer = Math.max(w, h);
                    let shorter = Math.min(w, h);

                    if (longer >= MIN_CARD_SIDE_PX && shorter > 0) {
                        let ratio = longer / shorter;
                        let deviation = Math.abs(ratio - CARD_RATIO);

                        if (deviation <= CARD_RATIO_TOLERANCE) {
                            // Extract corner points
                            let pts = [];
                            for (let j = 0; j < 4; j++) {
                                pts.push({
                                    x: approx.data32S[j * 2],
                                    y: approx.data32S[j * 2 + 1]
                                });
                            }
                            allCandidates.push({ pts: pts, deviation: deviation, longer: longer });

                            // Pick largest matching contour
                            if (!bestCandidate || longer > bestCandidate.longer) {
                                bestCandidate = { pts: pts, deviation: deviation, longer: longer, rotated: rotated };
                                bestApproxPts = pts;
                            }
                        }
                    }
                }
                approx.delete();
            }

            if (!bestCandidate) {
                // Debug: draw all contours found (no card match)
                debugCardMat = src.clone();
                cv.drawContours(debugCardMat, contours, -1, new cv.Scalar(100, 100, 100, 255), 1);
                matToCanvas(debugCardMat, 'debug-card');
                return null;
            }

            // Order corners [TL, TR, BR, BL]
            let ordered = orderCorners(bestApproxPts);

            // Debug: draw all candidates (red) and winner (green)
            debugCardMat = src.clone();
            for (let c = 0; c < allCandidates.length; c++) {
                let pts = allCandidates[c].pts;
                let color = (allCandidates[c] === bestCandidate)
                    ? new cv.Scalar(0, 255, 0, 255)
                    : new cv.Scalar(255, 0, 0, 255);
                for (let k = 0; k < 4; k++) {
                    let p1 = pts[k];
                    let p2 = pts[(k + 1) % 4];
                    cv.line(debugCardMat,
                        new cv.Point(p1.x, p1.y),
                        new cv.Point(p2.x, p2.y),
                        color, 2);
                }
            }
            // Draw ordered corners with labels (circles)
            var cornerColors = [
                new cv.Scalar(255, 255, 0, 255),  // TL yellow
                new cv.Scalar(0, 255, 255, 255),   // TR cyan
                new cv.Scalar(255, 0, 255, 255),   // BR magenta
                new cv.Scalar(255, 128, 0, 255)    // BL orange
            ];
            for (let k = 0; k < 4; k++) {
                cv.circle(debugCardMat, new cv.Point(ordered[k].x, ordered[k].y),
                    6, cornerColors[k], -1);
            }
            matToCanvas(debugCardMat, 'debug-card');

            // Compute pxPerMm from original image edge lengths
            let topEdgeLen = Math.hypot(
                ordered[1].x - ordered[0].x,
                ordered[1].y - ordered[0].y
            );
            let leftEdgeLen = Math.hypot(
                ordered[3].x - ordered[0].x,
                ordered[3].y - ordered[0].y
            );
            let longerEdge = Math.max(topEdgeLen, leftEdgeLen);
            let shorterEdge = Math.min(topEdgeLen, leftEdgeLen);

            // Determine if card is rotated (portrait vs landscape)
            let isRotated = leftEdgeLen > topEdgeLen;
            let widthMm = isRotated ? CARD_HEIGHT_MM : CARD_WIDTH_MM;
            let heightMm = isRotated ? CARD_WIDTH_MM : CARD_HEIGHT_MM;

            let pxPerMmW = topEdgeLen / widthMm;
            let pxPerMmH = leftEdgeLen / heightMm;
            let pxPerMm = (pxPerMmW + pxPerMmH) / 2.0;

            // Card top edge: the two corners closest to image top
            let topY = Math.min(ordered[0].y, ordered[1].y);
            let cardTopEdge = {
                y: topY,
                centerX: (ordered[0].x + ordered[1].x) / 2
            };

            // Card bounding rect for ROI computation
            let tempCornersMat = cv.matFromArray(4, 1, cv.CV_32SC2, [
                ordered[0].x, ordered[0].y,
                ordered[1].x, ordered[1].y,
                ordered[2].x, ordered[2].y,
                ordered[3].x, ordered[3].y
            ]);
            let cardRect = cv.boundingRect(tempCornersMat);
            tempCornersMat.delete();

            // Perspective quality check
            let observedRatio = longerEdge / shorterEdge;
            let perspectiveDeviation = Math.abs(observedRatio - CARD_RATIO) / CARD_RATIO;
            let perspectiveOk = perspectiveDeviation <= PERSPECTIVE_OK_TOLERANCE;

            // Perspective correction (for debug visualization)
            let rectified = null;
            let srcPts = null;
            let dstPts = null;
            let M = null;
            try {
                let dstW = Math.round(widthMm * 4);  // 4 px/mm
                let dstH = Math.round(heightMm * 4);

                srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    ordered[0].x, ordered[0].y,
                    ordered[1].x, ordered[1].y,
                    ordered[2].x, ordered[2].y,
                    ordered[3].x, ordered[3].y
                ]);
                dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0, dstW, 0, dstW, dstH, 0, dstH
                ]);

                M = cv.getPerspectiveTransform(srcPts, dstPts);
                rectified = new cv.Mat();
                cv.warpPerspective(src, rectified, M, new cv.Size(dstW, dstH));
            } catch (e) {
                // Perspective transform failed — non-fatal, skip rectification
                rectified = null;
            } finally {
                releaseMats(srcPts, dstPts, M);
            }

            return {
                corners: ordered,
                rectified: rectified,
                pxPerMm: pxPerMm,
                cardTopEdge: cardTopEdge,
                cardRect: cardRect,
                perspectiveOk: perspectiveOk,
                perspectiveDeviation: perspectiveDeviation,
                isRotated: isRotated
            };
        } finally {
            releaseMats(edges, dilated, hierarchy, kernel, debugCardMat);
            if (contours) contours.delete();
        }
    }

    // ── Helper: cv.inRange with proper Mat bounds ───────────────────
    function inRangeHSV(hsvMat, hLow, sLow, vLow, hHigh, sHigh, vHigh, dst) {
        // OpenCV.js inRange requires Mat bounds (not Scalar) in many builds
        let low = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), [hLow, sLow, vLow, 0]);
        let high = new cv.Mat(hsvMat.rows, hsvMat.cols, hsvMat.type(), [hHigh, sHigh, vHigh, 0]);
        try {
            cv.inRange(hsvMat, low, high, dst);
        } finally {
            releaseMats(low, high);
        }
    }

    // ── Step 3: Detect Skin in ROI ──────────────────────────────────
    function detectSkin(src, cardTopEdge, cardRect) {
        // ROI: from card bottom edge downward, full width
        let roiY = Math.min(cardRect.y + cardRect.height, src.rows - 1);
        let roiH = Math.min(src.rows - roiY, Math.round(src.rows * 0.7));
        let roiX = 0;
        let roiW = src.cols;

        if (roiH < 20 || roiW < 20) return null;

        let roi = null;
        let rgb = null;
        let hsvImg = null;
        let mask1 = null;
        let mask2 = null;
        let skinMask = null;
        let erodeKernel = null;
        let dilateKernel = null;
        let contours = null;
        let hierarchy = null;
        let debugRoiMat = null;

        try {
            roi = src.roi(new cv.Rect(roiX, roiY, roiW, roiH));

            // Convert RGBA → RGB → HSV
            rgb = new cv.Mat();
            cv.cvtColor(roi, rgb, cv.COLOR_RGBA2RGB);
            hsvImg = new cv.Mat();
            cv.cvtColor(rgb, hsvImg, cv.COLOR_RGB2HSV);

            // Skin detection: two HSV ranges
            mask1 = new cv.Mat();
            mask2 = new cv.Mat();
            skinMask = new cv.Mat();

            inRangeHSV(hsvImg, SKIN_H_LOW1, SKIN_S_LOW1, SKIN_V_LOW1,
                                SKIN_H_HIGH1, SKIN_S_HIGH1, SKIN_V_HIGH1, mask1);
            inRangeHSV(hsvImg, SKIN_H_LOW2, SKIN_S_LOW2, SKIN_V_LOW2,
                                SKIN_H_HIGH2, SKIN_S_HIGH2, SKIN_V_HIGH2, mask2);
            cv.bitwise_or(mask1, mask2, skinMask);

            // Morphological cleanup
            erodeKernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
            dilateKernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
            cv.erode(skinMask, skinMask, erodeKernel, new cv.Point(-1, -1), 1);
            cv.dilate(skinMask, skinMask, dilateKernel, new cv.Point(-1, -1), 2);

            // Debug: show skin mask
            matToCanvas(skinMask, 'debug-skin');

            // Find contours in skin mask
            contours = new cv.MatVector();
            hierarchy = new cv.Mat();
            cv.findContours(skinMask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            // Find largest contour
            let maxArea = 0;
            let maxIdx = -1;
            let roiArea = roiW * roiH;
            for (let i = 0; i < contours.size(); i++) {
                let area = cv.contourArea(contours.get(i));
                if (area > maxArea) {
                    maxArea = area;
                    maxIdx = i;
                }
            }

            // Check if skin region is too small
            if (maxIdx === -1 || maxArea < roiArea * 0.02) {
                // Debug: show empty ROI
                matToCanvas(roi, 'debug-roi');
                return null;
            }

            // Find tip: farthest point from card top edge
            let largestContour = contours.get(maxIdx);
            let originX = cardTopEdge.centerX - roiX;
            let originY = cardTopEdge.y - roiY; // negative (above ROI)

            let maxDist = 0;
            let tipX = 0;
            let tipY = 0;
            for (let j = 0; j < largestContour.data32S.length; j += 2) {
                let px = largestContour.data32S[j];
                let py = largestContour.data32S[j + 1];
                let dist = Math.hypot(px - originX, py - originY);
                if (dist > maxDist) {
                    maxDist = dist;
                    tipX = px + roiX;  // back to full image coords
                    tipY = py + roiY;
                }
            }

            // Debug: draw ROI with contour and tip point
            debugRoiMat = roi.clone();
            cv.drawContours(debugRoiMat, contours, maxIdx,
                new cv.Scalar(0, 255, 0, 255), 2);
            // Tip marker (in ROI coords)
            cv.circle(debugRoiMat,
                new cv.Point(tipX - roiX, tipY - roiY),
                8, new cv.Scalar(0, 255, 255, 255), -1);
            // Origin marker (in ROI coords, may be above ROI so clamp)
            let originDrawY = Math.max(0, Math.round(cardTopEdge.y - roiY));
            cv.circle(debugRoiMat,
                new cv.Point(Math.round(originX), originDrawY),
                6, new cv.Scalar(255, 255, 0, 255), -1);
            // Measurement line in ROI coords
            cv.line(debugRoiMat,
                new cv.Point(Math.round(originX), originDrawY),
                new cv.Point(tipX - roiX, tipY - roiY),
                new cv.Scalar(255, 100, 100, 255), 2);
            matToCanvas(debugRoiMat, 'debug-roi');

            return {
                tipPoint: { x: tipX, y: tipY },
                roiOffset: { x: roiX, y: roiY },
                contourArea: maxArea
            };
        } finally {
            releaseMats(roi, rgb, hsvImg, mask1, mask2, skinMask,
                        erodeKernel, dilateKernel, hierarchy, debugRoiMat);
            if (contours) contours.delete();
        }
    }

    // ── Step 4: Compute Measurement ─────────────────────────────────
    function computeMeasurement(cardTopEdge, tipPoint, pxPerMm) {
        let lengthPx = Math.hypot(
            tipPoint.x - cardTopEdge.centerX,
            tipPoint.y - cardTopEdge.y
        );
        let lengthMm = lengthPx / pxPerMm;
        let lengthCm = (lengthMm / 10).toFixed(1);
        return {
            lengthPx: lengthPx,
            lengthMm: Math.round(lengthMm * 10) / 10,
            lengthCm: lengthCm
        };
    }

    // ── Step 5: Draw Overlay ────────────────────────────────────────
    function drawOverlay(src, cardCorners, tipPoint, cardTopEdge, lengthCm, perspectiveOk) {
        // Render original image to result canvas
        cv.imshow('result-canvas', src);

        // Draw overlays using Canvas 2D API
        let ctx = $resultCanvas.getContext('2d');

        // Card outline (green polygon)
        ctx.strokeStyle = '#44ff88';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cardCorners[0].x, cardCorners[0].y);
        for (let i = 1; i < 4; i++) {
            ctx.lineTo(cardCorners[i].x, cardCorners[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        // Corner dots
        var cColors = ['#ffff00', '#00ffff', '#ff00ff', '#ff8800'];
        for (let i = 0; i < 4; i++) {
            ctx.fillStyle = cColors[i];
            ctx.beginPath();
            ctx.arc(cardCorners[i].x, cardCorners[i].y, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Origin marker (yellow circle at card top edge center)
        ctx.fillStyle = '#ffdd33';
        ctx.beginPath();
        ctx.arc(cardTopEdge.centerX, cardTopEdge.y, 7, 0, Math.PI * 2);
        ctx.fill();

        // Tip marker (cyan circle)
        ctx.fillStyle = '#00ffdd';
        ctx.beginPath();
        ctx.arc(tipPoint.x, tipPoint.y, 7, 0, Math.PI * 2);
        ctx.fill();

        // Measurement line (green, from origin to tip)
        ctx.strokeStyle = '#44ff88';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        ctx.beginPath();
        ctx.moveTo(cardTopEdge.centerX, cardTopEdge.y);
        ctx.lineTo(tipPoint.x, tipPoint.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Length label at midpoint of line
        let midX = (cardTopEdge.centerX + tipPoint.x) / 2;
        let midY = (cardTopEdge.y + tipPoint.y) / 2;

        ctx.font = 'bold 20px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Black outline for readability
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.strokeText(lengthCm + ' cm', midX + 30, midY);
        // White fill
        ctx.fillStyle = '#fff';
        ctx.fillText(lengthCm + ' cm', midX + 30, midY);

        // Perspective warning on image
        if (!perspectiveOk) {
            ctx.font = 'bold 14px system-ui';
            ctx.fillStyle = '#ff4444';
            ctx.textAlign = 'center';
            ctx.fillText('Card may be tilted', src.cols / 2, 24);
        }
    }

    // ── Main Pipeline ───────────────────────────────────────────────
    function runPipeline(imgElement) {
        if (!cvReady) {
            showError('OpenCV.js not ready yet. Please wait.');
            return;
        }

        // Validate image dimensions
        if (imgElement.naturalWidth < 480 || imgElement.naturalHeight < 480) {
            showError('Image resolution too low. Use a higher quality photo (min 480px).');
            return;
        }

        hide($inputSection);
        show($processing);
        hide($errorBanner);
        hide($warningBanner);

        // Use setTimeout to let the spinner render before heavy computation
        setTimeout(function() {
            let src = null;
            let preResult = null;
            let cardResult = null;

            try {
                // Load image
                src = loadImageToMat(imgElement);

                // Step 1: Preprocess
                preResult = preprocessImage(src);

                // Step 2: Detect card
                cardResult = detectCard(preResult.enhanced, src);
                if (!cardResult) {
                    hide($processing);
                    showError('Could not find the card. Make sure the entire card is visible, flat, and well-lit.');
                    show($retakeBtn);
                    show($debugPanel);
                    return;
                }

                // Show perspective warning if needed
                if (!cardResult.perspectiveOk) {
                    showWarning('The card appears tilted (deviation: ' +
                        (cardResult.perspectiveDeviation * 100).toFixed(0) +
                        '%). Results may be less accurate. Hold the card flat.');
                }

                // pxPerMm quality check
                if (cardResult.pxPerMm < 5) {
                    showWarning('Camera may be too far from the card. Move closer for better accuracy.');
                } else if (cardResult.pxPerMm > 15) {
                    showWarning('Camera may be too close to the card.');
                }

                // Step 3: Detect skin
                let skinResult = detectSkin(src, cardResult.cardTopEdge, cardResult.cardRect);
                if (!skinResult) {
                    hide($processing);
                    showError('Could not detect the measurement area below the card. Ensure good lighting and contrast with the background.');
                    show($retakeBtn);
                    show($debugPanel);
                    return;
                }

                // Step 4: Compute measurement
                let measurement = computeMeasurement(
                    cardResult.cardTopEdge,
                    skinResult.tipPoint,
                    cardResult.pxPerMm
                );

                // Step 5: Draw overlay
                drawOverlay(src, cardResult.corners, skinResult.tipPoint,
                    cardResult.cardTopEdge, measurement.lengthCm, cardResult.perspectiveOk);

                // Update debug metrics
                $debugMetrics.textContent =
                    'px/mm: ' + cardResult.pxPerMm.toFixed(2) + '\n' +
                    'Card ratio (observed): ' + (cardResult.isRotated
                        ? (cardResult.pxPerMm * CARD_WIDTH_MM / (cardResult.pxPerMm * CARD_HEIGHT_MM)).toFixed(3)
                        : 'N/A') + '\n' +
                    'Card rotated: ' + (cardResult.isRotated ? 'yes' : 'no') + '\n' +
                    'Perspective deviation: ' + (cardResult.perspectiveDeviation * 100).toFixed(1) + '%\n' +
                    'Perspective OK: ' + cardResult.perspectiveOk + '\n' +
                    'Skin contour area: ' + skinResult.contourArea + ' px\n' +
                    'Tip point: (' + skinResult.tipPoint.x + ', ' + skinResult.tipPoint.y + ')\n' +
                    'Length: ' + measurement.lengthPx.toFixed(1) + ' px = ' +
                        measurement.lengthMm + ' mm = ' + measurement.lengthCm + ' cm';

                // Show results
                hide($processing);
                showResult(measurement.lengthCm, cardResult.pxPerMm);

            } catch (err) {
                hide($processing);
                showError('Processing error: ' + (err.message || String(err)));
                show($retakeBtn);
                show($debugPanel);
                console.error('Pipeline error:', err);
            } finally {
                // Cleanup: src is used by drawOverlay (imshow copies data), safe to delete
                releaseMats(src);
                if (preResult) {
                    releaseMats(preResult.gray, preResult.blurred, preResult.enhanced);
                }
                if (cardResult && cardResult.rectified) {
                    releaseMats(cardResult.rectified);
                }
            }
        }, 50); // small delay for spinner to render
    }

    // ── Event Handlers ──────────────────────────────────────────────
    $fileInput.addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let img = new Image();
        img.onload = function() {
            runPipeline(img);
            URL.revokeObjectURL(img.src);
        };
        img.onerror = function() {
            showError('Failed to load the image. Please try a different photo.');
            URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);

        // Reset so same file can be re-selected
        e.target.value = '';
    });

    $retakeBtn.addEventListener('click', function() {
        resetUI();
    });

    // ── OpenCV Initialization ───────────────────────────────────────
    function onOpenCVReady() {
        // The CDN build sets cv as a global. Check if runtime is already initialized.
        if (typeof cv !== 'undefined' && typeof cv.Mat === 'function') {
            cvReady = true;
            $statusDot.classList.add('ready');
            $statusText.textContent = 'Ready';
            $fileLabel.classList.remove('disabled');
            $fileInput.disabled = false;
            return;
        }

        // Wait for WASM runtime initialization
        if (typeof cv !== 'undefined') {
            cv['onRuntimeInitialized'] = function() {
                cvReady = true;
                $statusDot.classList.add('ready');
                $statusText.textContent = 'Ready';
                $fileLabel.classList.remove('disabled');
                $fileInput.disabled = false;
            };
        }
    }

    // Timeout: if OpenCV hasn't loaded in 30 seconds, show error
    setTimeout(function() {
        if (!cvReady) {
            $statusText.textContent = 'Failed to load';
            $statusDot.style.background = '#ff8800';
            showError('OpenCV.js failed to load within 30 seconds. Check your internet connection and reload the page.');
        }
    }, 30000);
    </script>

    <!-- OpenCV.js from CDN — placed after main script so onOpenCVReady is defined -->
    <script async
        src="https://docs.opencv.org/4.9.0/opencv.js"
        onload="onOpenCVReady()"
        onerror="document.getElementById('status-text').textContent='Load failed'; document.getElementById('error-banner').textContent='Could not download OpenCV.js. Check your internet connection.'; document.getElementById('error-banner').classList.remove('hidden');"
        type="text/javascript"></script>
</body>
</html>
